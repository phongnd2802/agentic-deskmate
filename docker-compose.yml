name: agentic-deskmate

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deskmate
      POSTGRES_PASSWORD: deskmate
      POSTGRES_DB: deskmate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskmate -d deskmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "uv run --frozen alembic upgrade head && uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      SESSION_COOKIE_SECURE: "false" # local development is plain HTTP
      DATABASE_URL: postgresql+asyncpg://deskmate_app:deskmate_app@db:5432/deskmate
      MIGRATION_DATABASE_URL: postgresql+asyncpg://deskmate:deskmate@db:5432/deskmate
      # Development only: this fallback key is public, so it protects nothing. Set ENCRYPTION_KEY wherever real Provider keys live.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-emLWnCeO_xnfiCM5LlS_17e55zzNxfbfBpCsrgjLDYs=}
      # Private networks Providers may use, e.g. 192.168.0.0/16 for a local Ollama. Empty blocks them all.
      PROVIDER_ALLOWED_NETWORKS: ${PROVIDER_ALLOWED_NETWORKS:-}
      # The browser tests answer from the scripted Model (make test-e2e); otherwise Providers are called.
      SCRIPTED_MODEL: ${SCRIPTED_MODEL:-false}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports: FastAPI is only reachable inside the Compose network (ADR-0003).

  frontend:
    build: ./frontend
    command: bun run dev
    environment:
      BACKEND_URL: http://backend:8000
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
