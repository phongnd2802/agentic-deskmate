[project]
name = "deskmate-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi==0.162.0",
    "pydantic-ai-slim[ag-ui,anthropic,openai]==2.64.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
